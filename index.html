<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tristan</title>

    <style>
      body {
        margin: 0;
        font-family: 'Finlandica', sans-serif;
        background: #081c3a;
      }
      .loader-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        display: flex;
        color: white;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #081c3a;
        z-index: 9999;
        transition: opacity 1.2s ease-out;
      }
      .loading-text {
        margin-top: 1rem;
      }
      .loader-container.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .loader {
        width: min(15vw, 80px);
        height: min(7.5vw, 40px);
        position: relative;
      }
      .loader:before,
      .loader:after {
        content: '';
        width: min(7.5vw, 40px);
        height: min(7.5vw, 40px);
        border-radius: 50%;
        position: absolute;
        top: 0;
      }
      .loader:before {
        background: #3990ff;
        animation: circle1 2.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 2;
        left: 0;
      }
      .loader:after {
        background: #fa8334;
        animation: circle2 2.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
        right: 0;
      }
      @keyframes circle1 {
        0% {
          transform: translateX(0) scale(1);
        }
        25% {
          transform: translateX(0) scale(1.1);
        }
        50% {
          transform: translateX(100%) scale(1);
        }
        75% {
          transform: translateX(100%) scale(0.9);
        }
        100% {
          transform: translateX(0) scale(1);
        }
      }
      @keyframes circle2 {
        0% {
          transform: translateX(0) scale(1);
          z-index: 1;
        }
        25% {
          transform: translateX(0) scale(0.9);
          z-index: 1;
        }
        49% {
          z-index: 1;
        }
        50% {
          transform: translateX(-100%) scale(1);
          z-index: 3;
        }
        75% {
          transform: translateX(-100%) scale(1.1);
          z-index: 3;
        }
        100% {
          transform: translateX(0) scale(1);
          z-index: 3;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="loader-container">
        <div class="loader"></div>
        <p class="loading-text">Chargement...</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
